<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>PS5-Relapse</title>
  <style>
    html, body {
      background: #060606;
      color: #fff;
      font-family: Tahoma, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    /* الحاوية لجعل الصورة والكونسول جنباً إلى جنب */
    .main-layout {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 30px;
    }
    /* تنسيق صورة القط */
    .cat-image {
      width: 180px;
      height: 180px;
      border-radius: 10px;
      object-fit: cover;
      border: 2px solid #333;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    /* تنسيق شاشة الكونسول السوداء بناءً على كودك الأصلي */
    #console {
      width: 450px;
      min-height: 180px;
      background-color: #000;
      color: #00ff66;
      font-family: monospace;
      text-align: left;
      padding: 15px;
      border-radius: 5px;
      border: 1px solid #333;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <!-- التنسيق: صورة القط في اليسار والكونسول في اليمين -->
  <div class="main-layout">
    <div>
      <img src="https://i.imgur.com/3ZQW3r5.jpg" alt="Cat" class="cat-image">
    </div>
    
    <div id="console">Ready. Awaiting execution...</div>
  </div>

  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>
</body>
</html>
