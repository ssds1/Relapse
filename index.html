<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS5 - Relapse Host</title>
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #11141c 0%, #060606 100%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-y: auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      margin: 0;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(0, 168, 255, 0.6);
    }

    .subtitle {
      font-size: 0.85rem;
      color: #00ffcc;
      margin-top: 5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .payloads-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 20px;
    }

    .payload-card {
      background: rgba(15, 20, 30, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      text-align: left;
    }

    .payload-card:hover, .payload-card.active {
      background: rgba(0, 168, 255, 0.25);
      border-color: #00a8ff;
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 168, 255, 0.4);
    }

    .payload-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #00ffcc;
      margin-bottom: 5px;
    }

    .payload-desc {
      font-size: 0.75rem;
      color: #8c9bae;
      line-height: 1.3;
    }
