<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS5 - Relapse Host</title>
  <style>
    /* تنسيقات عامة للواجهة بتصميم عصري وخلفية داكنة */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #11141c 0%, #060606 100%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* رأس الصفحة والشعار مع تأثير النيون */
    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.8rem;
      margin: 0;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(0, 168, 255, 0.6), 0 0 30px rgba(0, 168, 255, 0.3);
    }

    .subtitle {
      font-size: 1rem;
      color: #8c9bae;
      margin-top: 8px;
      letter-spacing: 1px;
    }

    /* صندوق إظهار حالات الجيلبريك والكونسول */
    #console {
      width: 80%;
      max-width: 650px;
      height: 180px;
      background: rgba(15, 20, 30, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      overflow-y: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      color: #00ffcc;
      text-shadow: 0 0 5px rgba(0, 255, 204, 0.4);
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    /* شريط تذييل بسيط ومرتب */
    .footer {
      margin-top: 25px;
      font-size: 0.85px;
      color: #556270;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>PS5 RELAPSE</h1>
    <div class="subtitle">Secure Exploit Host Interface</div>
  </div>

  <!-- عنصر الكونسول كما هو تماماً لكي تعمل السكربتات البرمجية دون مشاكل -->
  <div id="console">Initializing Host Environment...</div>

  <div class="footer">Ready for execution</div>

  <!-- الملفات الأساسية للجيلبريك (لم يتم المساس بمساراتها أبداً لضمان استقرار العمل) -->
  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>
</body>
</html>
