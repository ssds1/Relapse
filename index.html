<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS5 - Relapse Host</title>
  
  <!-- التحميل المسبق للسكربتات الحساسة لضمان الاستقرار والسرعة -->
  <link rel="preload" href="./src/firmware.js" as="script">
  <link rel="preload" href="./src/main.js" as="script">
  <link rel="preload" href="./src/rop.js" as="script">
  <link rel="preload" href="./src/utils/syscalls.js" as="script">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #11141c 0%, #060606 100%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
      z-index: 2;
    }

    h1 {
      font-size: 2.8rem;
      margin: 0;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(0, 168, 255, 0.6), 0 0 30px rgba(0, 168, 255, 0.3);
    }

    .subtitle {
      font-size: 1rem;
      color: #8c9bae;
      margin-top: 8px;
      letter-spacing: 1px;
    }

    #console {
      width: 80%;
      max-width: 650px;
      height: 180px;
      background: rgba(15, 20, 30, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      overflow-y: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      color: #00ffcc;
      text-shadow: 0 0 5px rgba(0, 255, 204, 0.4);
      white-space: pre-wrap;
      word-wrap: break-word;
      z-index: 2;
    }

    .footer {
      margin-top: 25px;
      font-size: 0.85rem;
      color: #556270;
      letter-spacing: 0.5px;
      z-index: 2;
    }

    /* تصميم ولعبة حركة القطة اللطيفة في الأسفل */
    .cute-cat {
      position: absolute;
      bottom: 10px;
      left: -60px;
      font-size: 1.8rem;
      z-index: 1;
      animation: walkCat 18s linear infinite;
      filter: drop-shadow(0 0 8px rgba(0, 255, 204, 0.4));
      pointer-events: none;
    }

    @keyframes walkCat {
      0% {
        left: -60px;
        transform: scaleX(1);
      }
      49% {
        transform: scaleX(1);
      }
      50% {
        left: calc(100% + 20px);
        transform: scaleX(-1);
      }
      99% {
        transform: scaleX(-1);
      }
      100% {
        left: -60px;
        transform: scaleX(1);
      }
    }
  </style>
</head>
<body>

  <!-- القطة المتحركة اللطيفة -->
  <div class="cute-cat">🐱</div>

  <div class="header">
    <h1>PS5 RELAPSE</h1>
    <div class="subtitle">Stable Exploit Host</div>
  </div>

  <div id="console">Initializing Stable Environment...</div>

  <div class="footer">Optimized for Stability</div>

  <!-- السكربتات الأساسية مرتبة بالتسلسل الصحيح لضمان الاستقرار -->
  <script src="./src/firmware.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/main.js"></script>
  <script type="module" src="./src/site.js"></script>
</body>
</html>
