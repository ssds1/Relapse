<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS5 - Relapse Host</title>
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #11141c 0%, #060606 100%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.5rem;
      margin: 0;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(0, 168, 255, 0.6), 0 0 30px rgba(0, 168, 255, 0.3);
    }

    .subtitle {
      font-size: 0.9rem;
      color: #00ffcc;
      margin-top: 5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
    }

    /* حاوية الأزرار الجديدة */
    .button-container {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #fff;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .btn:hover {
      background: rgba(0, 168, 255, 0.3);
      border-color: #00a8ff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 168, 255, 0.4);
    }

    .btn-payload {
      border-color: rgba(0, 255, 204, 0.3);
      color: #00ffcc;
    }

    .btn-payload:hover {
      background: rgba(0, 255, 204, 0.2);
      border-color: #00ffcc;
    }

    #console {
      width: 80%;
      max-width: 650px;
      height: 150px;
      background: rgba(15, 20, 30, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      overflow-y: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.9rem;
      color: #00ffcc;
      text-shadow: 0 0 5px rgba(0, 255, 204, 0.4);
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .footer {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #556270;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>PS5 RELAPSE</h1>
    <div class="subtitle">Exploit & Payload Host</div>
  </div>

  <!-- أزرار التحكم الجديدة -->
  <div class="button-container">
    <button class="btn" onclick="location.reload()">Reload Exploit</button>
    <button class="btn btn-payload" onclick="loadPayload('etaHEN.bin')">Load etaHEN</button>
    <!-- يمكنك إضافة أزرار إضافية هنا لباقي البايلودات بنفس الطريقة -->
  </div>

  <div id="console">Ready. Click 'Load etaHEN' after exploit succeeds.</div>

  <div class="footer">Custom UI by Ssds</div>

  <!-- السكربتات الأساسية -->
  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>

  <!-- دالة بسيطة لربط الأزرار بتشغيل البايلودات -->
  <script>
    function loadPayload(payloadName) {
      writeLog("Loading payload: " + payloadName, "info");
      // ضع هنا الكود أو الدالة الخاصة بإرسال أو تحميل ملف البايلود إذا كان مدعوماً في ملفاتك
    }
  </script>
</body>
</html>
